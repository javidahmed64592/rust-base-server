[package]
name = "rust_base_server"
version = "0.1.0"
description = "A template for creating Rust applications."
edition = "2024"
repository = "https://github.com/javidahmed64592/rust-base-server"
license = "MIT"
authors = ["Javid Ahmed <javidahmed@icloud.com>"]

[package.metadata.wix]
upgrade-guid = "5C25D2FE-94E1-4BD1-9DD5-4BA37A737700"
path-guid = "330E736F-2F5D-402C-9731-C6147B1CAE0A"
license = false
eula = false

[dependencies]
argon2 = "0.5.3"
rocket = { version = "0.5.1", features = ["json", "secrets"] }
serde = { version = "1.0.228", features = ["derive"] }

[profile.dist]
inherits = "release"
lto = "thin"
